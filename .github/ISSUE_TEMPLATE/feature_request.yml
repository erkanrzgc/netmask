name: Feature request
description: Propose a focused Netmask improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should Netmask solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and platform impact
      description: Cover privileges, restore behavior, networking, and persisted state.
    validations:
      required: true
